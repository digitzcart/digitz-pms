<style>

:root[data-theme=light]{--bg:#f7f3e8;--bg2:#efe9da;--surface:#fff;--surface2:#f3eee1;--line:#e2dbc9;--text:#1c1a17;--muted:#6f685a;--accent-text:#8a6b00;--shadow:0 10px 30px rgba(60,50,20,.12);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
h1,h2,h3{font-family:var(--display);font-weight:900;letter-spacing:-.02em;line-height:1.02;margin:0}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .caps{text-transform:uppercase}
html[lang=ml] h1,html[lang=ml] h2{font-family:var(--font);font-weight:800;letter-spacing:0;line-height:1.25}
h1{font-size:clamp(30px,7vw,52px)}h2{font-size:clamp(20px,4.5vw,28px)}h3{font-size:17px;font-family:var(--font);font-weight:800;letter-spacing:0}
.hl{color:var(--accent-text)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.right{text-align:end}.center{text-align:center}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Layout */
#app{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:24px;color:var(--accent);letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo small{font-family:var(--font);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.topbar .grow{flex:1}
.content{padding:18px 16px calc(var(--nav-h) + 24px + var(--safe-b));max-width:1180px;width:100%;margin:0 auto}
.bottomnav{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--line)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;position:relative}
.bottomnav a.on{color:var(--accent)}
.bottomnav svg,.side svg{width:22px;height:22px}
.navbadge{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}
@media (min-width:960px){
  .bottomnav{display:none}
  .side{display:flex;flex-direction:column;width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-inline-end:1px solid var(--line);padding:18px 12px}
  .side .logo,.side a.logo:hover{padding:6px 10px 18px;color:var(--accent);background:none}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700;position:relative}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent);color:var(--accent-ink)}
  .side .sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;font-weight:800}
  .side .navbadge{position:static;margin-inline-start:auto}
  .content{padding-bottom:40px}
  .topbar .logo{display:none}
}
/* Components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--surface2);color:var(--text);text-decoration:none;min-height:44px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.icon{padding:0;width:42px;min-height:42px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
@media(min-width:760px){#txform .formgrid{grid-template-columns:repeat(6,minmax(0,1fr))}#txform .formgrid>.field{grid-column:span 3}#txform .formgrid>[data-field=date],#txform .formgrid>[data-field=reference],#txform .formgrid>[data-field=family_member_id]{grid-column:span 2}#txform .formgrid>.full{grid-column:1/-1}}.tx-tbl tbody tr:hover{background:var(--surface2)}.tx-tbl td,.tx-tbl th{padding:11px 14px}.tenant-id-box{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}.tenant-id-box b{font-size:22px;font-weight:900;letter-spacing:.03em}.tenant-id-box .muted{color:inherit;opacity:.75}.tx-lines{display:grid;gap:10px}.tx-side{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface2)}.tx-side-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tx-side-h b{font-size:15px;text-transform:uppercase;letter-spacing:.04em}.tx-sum{margin-inline-start:auto;font-weight:800}.tx-line{display:grid;grid-template-columns:minmax(0,1fr) 170px 38px;gap:8px;margin-bottom:8px;align-items:center}.tx-line .tx-del{padding:0;height:38px;font-size:18px}.tx-swap{display:flex;justify-content:center;margin:-4px 0}.tx-bal{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line)}.tx-lines.err .tx-bal{border-color:var(--red)}@media(max-width:560px){.tx-line{grid-template-columns:minmax(0,1fr) 120px 34px}}.chips .chip{cursor:pointer}.chip.pick{position:relative;cursor:pointer;padding:8px 13px;font-size:13px}.chip.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.chip.pick:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip.pick:has(input:checked)::before{content:'✓'}.chip.pick:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}.field.err .chips{outline:1px solid var(--red);border-radius:12px;padding:6px}.chips .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.b-Vacant,.b-Cleared,.b-paid,.b-Paid,.b-Active,.b-Held,.b-Refunded{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.b-Booked,.b-Deposited,.b-Trial,.b-Partial,.b-Renewed{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--blue)}
.b-Leased,.b-Pending,.b-due,.b-Unpaid,.b-unpaid{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-text)}
.b-UnderMaintenance,.b-Replaced,.b-Expired,.b-Terminated,.b-cancelled{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.b-Bounced,.b-overdue,.b-Failed{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .v{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin-top:4px;word-break:break-word}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.stat.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.stat.accent .l{color:var(--accent-ink);opacity:.75}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:start;width:100%;color:inherit}
.item:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.item .t{font-weight:800}.item .s{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
a.item{text-decoration:none}
.item>svg,.alert>svg,.chip svg,.tabs svg{width:22px;height:22px;flex-shrink:0;color:var(--muted)}
a.item>svg+.t{flex:1}
svg{max-width:100%}
.item .amt{font-weight:800;white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface2);border-inline-start:4px solid var(--accent);margin-bottom:8px}
.alert.red{border-color:var(--red)}.alert.blue{border-color:var(--blue)}.alert.green{border-color:var(--green)}
.hero{border-radius:24px;padding:22px 20px;background:radial-gradient(120% 140% at 100% 0%,#3a3427 0%,var(--surface) 55%);border:1px solid var(--line);margin-bottom:14px}
:root[data-theme=light] .hero{background:radial-gradient(120% 140% at 100% 0%,#fff6c4 0%,var(--surface) 55%)}
.occbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:12px 0 8px}
.occbar span{display:block;height:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td.num,.tbl th.num{text-align:end;white-space:nowrap}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field .req{color:var(--red)}
.inp,select.inp,textarea.inp{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);min-height:46px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field.err .inp{border-color:var(--red)}
.field .msg{font-size:12px;color:var(--red)}
.formgrid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:640px){.formgrid{grid-template-columns:1fr 1fr}.formgrid .full{grid-column:1/-1}}
.check{display:flex;align-items:center;gap:10px;font-weight:700;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.money{position:relative}.money::before{content:"AED";position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--muted)}
.money .inp{padding-inline-start:48px}
.toggle{position:relative;width:50px;height:30px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.toggle span::after{content:"";position:absolute;width:22px;height:22px;top:3px;inset-inline-start:3px;background:var(--muted);border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{inset-inline-start:23px;background:var(--accent-ink)}
/* Modal sheet */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + var(--safe-b));box-shadow:var(--shadow);animation:up .2s}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;position:sticky;bottom:-20px;background:var(--surface);padding:10px 0}
@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes fade{from{opacity:0}}
.toasts{position:fixed;z-index:200;inset-inline:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);max-width:92vw;animation:up .2s}
.toast.err{background:var(--red);color:#fff}.toast.ok{background:var(--green);color:#10200f}
/* Lock / auth screens */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;background:radial-gradient(90% 60% at 50% 0%,#2e2a21,var(--bg) 70%)}
:root[data-theme=light] .auth{background:radial-gradient(90% 60% at 50% 0%,#fff3b0,var(--bg) 70%)}
.auth .box{width:100%;max-width:420px}
.auth h1{margin:14px 0 6px}
.pinDots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.pinDots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pinDots i.f{background:var(--accent);border-color:var(--accent)}
.pinDots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.keypad button{height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:800;cursor:pointer;aspect-ratio:1;justify-self:center}
.keypad button:active{background:var(--accent);color:var(--accent-ink)}
.keypad button.fn{background:transparent;border:0;font-size:14px}
.otp{letter-spacing:.5em;font-size:26px;text-align:center;font-weight:800}
.langbtn{font-weight:900;min-width:52px}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.on{background:var(--green)}.syncdot.ro{background:var(--orange)}.syncdot.off{background:var(--red)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img,.ph{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.ph{display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;padding:6px}
.chart svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 12px;font-weight:800;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs a.on{color:var(--text);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media print{body *{visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="module">
'use strict';
/* =====================================================================
   Digitz PMS — single-file PWA (vanilla JS, ES module)
   Offline-first: IndexedDB is the source of truth; cloud sync is optional.
   ===================================================================== */
const APP = { version: '1.0.0', schema: 2, api: './api/' };
const TZ = 'Asia/Dubai';

/* ---------------- DOM + misc helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const nowISO = () => new Date().toISOString();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const by = (k, dir = 1) => (a, b) => (a[k] > b[k] ? dir : a[k] < b[k] ? -dir : 0);
const b64 = { enc: (buf) => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); },
  dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
const b64u = (buf) => b64.enc(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uDec = (s) => b64.dec(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
const flags = { // localStorage: lightweight flags only (§1.2)
  get: (k, d = null) => { try { const v = localStorage.getItem('dz.' + k); return v === null ? d : v; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('dz.' + k, v); } catch {} },
};

/* ---------------- i18n ---------------- */
let LANG = flags.get('lang', 'en') === 'ml' ? 'ml' : 'en';
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  return s;
}
function setLang(l) {
  LANG = l; flags.set('lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = 'ltr'; // Malayalam/English are LTR; layout uses logical properties so RTL is safe
  render();
}

/* ---------------- Money (fils) ---------------- */
function fmtAED(fils) {
  const n = Math.round(Number(fils) || 0); const neg = n < 0; const a = Math.abs(n);
  const s = Math.floor(a / 100).toLocaleString('en-US') + '.' + String(a % 100).padStart(2, '0');
  return 'AED ' + (neg ? '-' : '') + s;
}

const idb = {

/* In-memory cache of live (non-deleted) records per store, invalidated on write. */
const cache = new Map();
async function list(store, { withDeleted = false } = {}) {
  if (!cache.has(store)) cache.set(store, await idb.getAll(store));

}
async function getRec(store, id) { if (!id) return null; return (await list(store, { withDeleted: true })).find((r) => r.id === id) || null; }
const invalidate = (store) => cache.delete(store);

/** Create/update a record with UUID + timestamps + owner, and queue it for sync. */
async function save(store, rec) {
  const now = nowISO();
  const r = { ...rec };
  if (!r.id) { r.id = uuid(); r.created_at = now; }
  r.created_at = r.created_at || now; r.updated_at = now;
  r.deleted_at = r.deleted_at ?? null;
  r.owner_user_id = r.owner_user_id || S.user?.id || null;
  await docAssign(store, r); await tenantCodeAssign(store, r);
  await idb.put(store, r); invalidate(store);
  if (SYNC_FIELDS[store]) await queueSync(store, r.id);
  return r;
}
async function queueSync(entity, id) {
  await idb.put('sync_queue', { id: `${entity}:${id}`, entity, record_id: id, queued_at: nowISO() });
  scheduleSync();
}

/* ---------------- Soft delete + Trash (30 days) ---------------- */
async function softDelete(store, id, label) {
  if (!(await confirmTwice(label))) return false;
  const rec = await getRec(store, id); if (!rec) return false;
  rec.deleted_at = nowISO(); rec.updated_at = rec.deleted_at;
  await idb.put(store, rec); invalidate(store);
  await idb.put('trash', { id: uuid(), entity: store, record_id: id, label: label || rec.name || rec.title || '', deleted_at: rec.deleted_at });
  invalidate('trash');
  if (SYNC_FIELDS[store]) await queueSync(store, id); // tombstone
  if (['leases', 'properties', 'rooms', 'bed_spaces'].includes(store)) await recomputeStatuses();
  toast(t('moved_to_trash'), 'ok');
  return true;
}
async function restoreTrash(trashId) {
  const tr = await getRec('trash', trashId); if (!tr) return;
  const rec = await getRec(tr.entity, tr.record_id);
  if (rec) { rec.deleted_at = null; rec.updated_at = nowISO(); await idb.put(tr.entity, rec); invalidate(tr.entity); if (SYNC_FIELDS[tr.entity]) await queueSync(tr.entity, rec.id); }
  await idb.del('trash', trashId); invalidate('trash');
  if (['leases', 'properties', 'rooms', 'bed_spaces'].includes(tr.entity)) await recomputeStatuses();
  toast(t('restored'), 'ok');
}
async function purgeTrash() {
  const cutoff = Date.now() - 30 * 86400000;
  for (const tr of await idb.getAll('trash')) {
    if (Date.parse(tr.deleted_at) > cutoff) continue;
    await idb.del(tr.entity, tr.record_id);
    if (tr.entity !== 'vault_files') for (const a of (await idb.getAll('attachments')).filter((a) => a.record_id === tr.record_id)) await idb.del('attachments', a.id);
    await idb.del('trash', tr.id);
  }
  cache.clear();
}

/** Modal sheet. Returns a promise resolved by close(value). */
function modal(html, { onMount, wide } = {}) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${wide ? 'style="max-width:900px"' : ''}>${html}</div>`;
    document.body.appendChild(ov);
    const close = (v) => { ov.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('click', (e) => { if (e.target === ov) close(null); if (e.target.closest('[data-close]')) close(null); });
    const first = ov.querySelector('input,select,textarea'); if (first && matchMedia('(min-width:700px)').matches) setTimeout(() => first.focus(), 50);
    onMount && onMount(ov.firstElementChild, close);
  });
}

        if (!writable) break;
        if (!SYNC_FIELDS[q.entity]) { await idb.del('sync_queue', q.id); continue; } // local-only never leaves the device
        const rec = await idb.get(q.entity, q.record_id); if (!rec) { await idb.del('sync_queue', q.id); continue; }
        const change = { entity: q.entity, id: rec.id, updated_at: rec.updated_at, deleted_at: rec.deleted_at || null, payload: pickSync(q.entity, rec) };
        const sz = JSON.stringify(change).length;
        if (sz > 200000) { console.warn('record too large to sync', q); await idb.del('sync_queue', q.id); continue; }
        if (bytes + sz > 800000 || batch.length >= 400) await flush();
        batch.push({ qid: q.id, change }); bytes += sz;
      }
      if (writable) await flush();
    }
    // PULL (allowed read-only even when the add-on has lapsed)
    let cursor = Number(await meta.get('sync_cursor', 0)); let more = true; let changed = false;
    while (more) {
      const r = await api('sync', 'pull', { cursor, limit: 500 }, { method: 'GET' });
      for (const c of r.changes) { await applyRemote(c.entity, c.record); changed = true; }
      cursor = r.cursor; more = r.more; writable = r.writable;
      await meta.set('sync_cursor', cursor);
    }
    S.sync = { ...(S.sync || {}), active: writable };
    S.syncState = writable ? 'on' : 'ro';
    flags.set('lastSync', nowISO());
    if (changed) { cache.clear(); await recomputeStatuses(false); if (!$('.overlay')) render(); }
  } catch (e) {
    console.warn('sync', e); S.syncState = e.status === 0 ? 'off' : 'err';
    if (manual) toast(e.message, 'err');
  } finally { syncing = false; updateSyncDot(); }
}

async function allUnits() {
  const [props, rooms, beds] = await Promise.all([list('properties'), list('rooms'), list('bed_spaces')]);
  const pName = (id) => props.find((p) => p.id === id)?.name || '?';
  const rName = (id) => rooms.find((r) => r.id === id)?.name || '?';
  return [
    ...props.map((p) => ({ entity: 'properties', id: p.id, property_id: p.id, label: p.name, sub: t('pt_' + (p.type || 'Flat')), status: p.status || 'Vacant', rent_fils: p.rent_fils, rec: p })),
    ...rooms.filter((r) => props.some((p) => p.id === r.property_id)).map((r) => ({ entity: 'rooms', id: r.id, property_id: r.property_id, label: `${pName(r.property_id)} › ${r.name}`, sub: t('unit_room'), status: r.status || 'Vacant', rent_fils: r.rent_fils, rec: r })),
    ...beds.filter((b) => rooms.some((r) => r.id === b.room_id)).map((b) => ({ entity: 'bed_spaces', id: b.id, property_id: b.property_id, label: `${pName(b.property_id)} › ${rName(b.room_id)} › ${b.name}`, sub: t('unit_bed'), status: b.status || 'Vacant', rent_fils: b.rent_fils, rec: b })),
  ];
}
async function unitLabel(entity, id) { const u = (await allUnits()).find((x) => x.entity === entity && x.id === id); return u ? u.label : t('unknown_unit'); }

/** Status engine: lease events drive unit status (manual "Under Maintenance" is respected). */
async function recomputeStatuses(notify = true) {
  const today = todayYMD();
  const leases = await list('leases');
  for (const l of leases) if (l.status === 'Active' && l.end_date && ymd(l.end_date) < today) await save('leases', { ...l, status: 'Expired' });
  const live = (await list('leases')).filter((l) => l.status === 'Active');
  for (const u of await allUnits()) {
    if (u.status === 'Under Maintenance') continue;
    const mine = live.filter((l) => l.unit_type === u.entity && l.unit_id === u.id);
    let st = 'Vacant';
    if (mine.some((l) => ymd(l.start_date) <= today && ymd(l.end_date) >= today)) st = 'Leased';
    else if (mine.some((l) => ymd(l.start_date) > today)) st = 'Booked';
    if (st !== u.status) await setUnitStatus(u.entity, u.id, st, notify);
  }
}
async function setUnitStatus(entity, id, status, notify = true) {
  const rec = await getRec(entity, id); if (!rec) return;
  const was = rec.status; await save(entity, { ...rec, status });
  if (notify && was === 'Vacant' && status !== 'Vacant' && hasModule('sharing') && S.session && online())
    api('vacancies', 'unit_status', { unit_id: id, status }).catch(() => {}); // auto-expire shared listing
}

/* ---------------- Dashboard ---------------- */
async function computeAlerts() {
  const today = todayYMD(); const out = [];
  for (const p of (await list('pdcs')).filter((x) => x.status === 'Pending')) {
    const d = daysUntil(p.due_date);
    const lbl = [t(p.direction === 'payable' ? 'dir_payable' : 'dir_receivable'), p.cheque_no ? '#' + p.cheque_no : '', p.bank, p.party, fmtAED(p.amount_fils)].filter(Boolean).join(' · ');
    if (d < 0) out.push({ lvl: 'red', sort: d, text: t('al_pdc_overdue', { n: -d }) + ' — ' + lbl, href: '#/pdcs' });
    else if (d === 0) out.push({ lvl: 'red', sort: d, text: t('al_pdc_today') + ' — ' + lbl, href: '#/pdcs' });
    else if (d <= 3) out.push({ lvl: '', sort: d, text: t('al_pdc_in', { n: d }) + ' — ' + lbl, href: '#/pdcs' });
    else if (d <= 7) out.push({ lvl: 'blue', sort: d, text: t('al_pdc_in', { n: d }) + ' — ' + lbl, href: '#/pdcs' });
  }
  const tenants = await list('tenants');
  for (const l of (await list('leases')).filter((x) => x.status === 'Active')) {
    const d = daysUntil(l.end_date);
    if (d >= 0 && d <= 90) out.push({ lvl: d <= 30 ? 'red' : d <= 60 ? '' : 'blue', sort: 100 + d, text: t('al_lease_exp', { n: d, name: tenantLabel(tenants.find((x) => x.id === l.tenant_id)) }), href: `#/lease/${l.id}` });
  }
  for (const b of (await list('bills')).filter((x) => x.status !== 'paid')) {
    const d = daysUntil(b.due_date); if (d !== null && d <= 3) out.push({ lvl: d < 0 ? 'red' : '', sort: 200 + d, text: t('al_bill', { name: b.name, d: fmtDate(b.due_date) }), href: '#/bills' });
  }
  if (hasModule('family')) for (const v of await list('vault_files')) {
    if (!v.expiry_date) continue; const d = daysUntil(v.expiry_date);
    if (d <= 90) out.push({ lvl: d <= 30 ? 'red' : 'blue', sort: 300 + d, text: d < 0 ? t('al_doc_expired', { name: v.title }) : t('al_doc_exp', { name: v.title, n: d }), href: '#/vault' });
  }
  if (hasModule('health')) for (const a of await list('appointments')) if (ymd(a.date_time) === today) out.push({ lvl: 'green', sort: 400, text: t('al_appt', { doctor: a.doctor, time: hm(a.date_time) }), href: '#/health?tab=appointments' });
  return out.sort(by('sort'));
}

/** In-app pop-up for cheques due today / in 3 / in 7 days (works offline), once per day; plus app badge. */
async function dailyAlerts() {
  const pending = (await list('pdcs')).filter((p) => p.status === 'Pending');
  const due = pending.filter((p) => { const d = daysUntil(p.due_date); return d <= 7; });
  badgeCount = due.length;
  try { if ('setAppBadge' in navigator) due.length ? navigator.setAppBadge(due.length) : navigator.clearAppBadge(); } catch {}
  const key = todayYMD(); if ((await meta.get('alert_day')) === key) return;
  const hot = due.filter((p) => [0, 3, 7].includes(daysUntil(p.due_date)) || daysUntil(p.due_date) < 0);
  if (!hot.length) return;
  await meta.set('alert_day', key);
  setTimeout(() => modal(`${sheetHead(t('cheque_alerts'))}<div class="list">${hot.sort(by('due_date')).map((p) => { const d = daysUntil(p.due_date);
    return `<div class="alert ${d <= 0 ? 'red' : d <= 3 ? '' : 'blue'}"><div><b>${esc(d < 0 ? t('al_pdc_overdue', { n: -d }) : d === 0 ? t('al_pdc_today') : t('al_pdc_in', { n: d }))}</b><br>

}

/* ---------------- Tenant ID: "T" + last 4 digits of the mobile (T4567, then T4567-2 if taken).
   Given once when the tenant is first saved with a mobile and kept even if the mobile changes later. */
const tenantDigits = (mobile) => String(mobile || '').replace(/\D/g, '').slice(-4);
async function tenantCodeFor(mobile, selfId) {
  const d = tenantDigits(mobile); if (!d) return '';
  const used = new Set((await list('tenants', { withDeleted: true })).filter((x) => x.id !== selfId && x.code).map((x) => x.code.toUpperCase()));
  for (const c of tenantIssued) used.add(c);
  const base = 'T' + d; if (!used.has(base)) return base;
  for (let i = 2; ; i++) if (!used.has(`${base}-${i}`)) return `${base}-${i}`;
}
const tenantIssued = new Set();
let tenantLock = Promise.resolve();
function tenantCodeAssign(store, r) {
  if (store !== 'tenants' || r.code || r.deleted_at || !tenantDigits(r.mobile)) return Promise.resolve();
  const run = tenantLock.then(async () => { if (!r.code) { r.code = await tenantCodeFor(r.mobile, r.id); if (r.code) tenantIssued.add(r.code.toUpperCase()); } });
  tenantLock = run.catch(() => {}); return run;
}

  tenantBackfilling = true; try { for (const x of todo.sort(by('created_at'))) await save('tenants', x); } finally { tenantBackfilling = false; }
}

function parseExtras(txt) {
  if (!txt) return [];
  const out = [];
  for (const line of txt.split('\n').map((s) => s.trim()).filter(Boolean)) {

/** Builds instalments from the lease terms (§3.3). */
function buildSchedule(l) {
  const s = ymd(l.start_date); const e = ymd(l.end_date); const months = monthsBetween(s, e);
  const total = Math.round((l.annual_rent_fils * months) / 12);
  const step = l.schedule_type === 'Monthly' ? 1 : l.schedule_type === 'Quarterly' ? 3 : months;
  const n = Math.max(1, Math.ceil(months / step)); const base = Math.floor(total / n); const rem = total - base * n;
  const rows = [];
  for (let i = 0; i < n; i++) rows.push({ seq: i + 1, kind: 'rent', label: t('instalment_n', { n: i + 1, of: n }), due_date: ymdToISO(addMonthsYMD(s, i * step)), amount_fils: base + (i === 0 ? rem : 0) });
  const fees = (l.admin_fee_fils || 0) + sum(l.extra_charges || [], (x) => x.amount_fils);
  if (fees > 0) rows.push({ seq: 0, kind: 'fees', label: t('fees_line'), due_date: l.start_date, amount_fils: fees });
  if (l.deposit_fils > 0) rows.push({ seq: -1, kind: 'deposit', label: t('deposit_line'), due_date: l.start_date, amount_fils: l.deposit_fils });
  return rows;
}
async function createSchedule(lease) {

    const method = r.kind === 'rent' ? lease.payment_method : 'Cash';
    let sch = await save('payment_schedules', { ...r, lease_id: lease.id, property_id: lease.property_id, method, status: 'due' });
    if (method === 'Cheque') {
      const pdc = await save('pdcs', { direction: 'receivable', cheque_no: '', bank: '', amount_fils: r.amount_fils, due_date: r.due_date, status: 'Pending', party: tenantLabel(tenant), lease_id: lease.id, schedule_id: sch.id, property_id: lease.property_id });
      sch = await save('payment_schedules', { ...sch, pdc_id: pdc.id });
    }
  }
}

  if (after.status === 'Bounced' && s && s.status === 'paid' && before.status === 'Cleared') {
    const tx = await getRec('transactions', s.transaction_id); if (tx) await save('transactions', { ...tx, deleted_at: nowISO() });

/* ---------------- Ledger accounts (Settings → Ledger Accounts) ----------------
   Built-in accounts keep their fixed codes (transactions store codes, accounting relies on them);
   a ledger_accounts record with the same code only renames or deactivates them. Custom accounts
   get a code 'la_xxxxxxxx' and a type the user chooses. */
const ACCT_TYPES = ['income', 'expense', 'asset', 'liability', 'equity'];
const SYS_ACCTS = { cash: 'asset', bank: 'asset', rent: 'income', fees: 'income', commission_in: 'income', deposit_in: 'liability', deposit_refund: 'liability', landlord_rent: 'expense', other: 'expense',
  maintenance: 'expense', utilities: 'expense', cleaning: 'expense', furniture: 'expense', govt_fees: 'expense', commission: 'expense', groceries: 'expense', medical: 'expense', education: 'expense', transport: 'expense' };
const REVENUE_CODES = ['rent', 'fees', 'commission_in', 'other'];
let LEDGER = [];
async function loadLedger() {
  const recs = await list('ledger_accounts'); const by = new Map(recs.map((r) => [r.code, r]));
  const sys = Object.entries(SYS_ACCTS).map(([code, type]) => { const r = by.get(code); return { code, type, system: true, id: r?.id, name: r?.name || '', active: r ? r.active !== false : true }; });
  const custom = recs.filter((r) => r.code && !SYS_ACCTS[r.code]).map((r) => ({ code: r.code, type: ACCT_TYPES.includes(r.type) ? r.type : 'expense', system: false, id: r.id, name: r.name || '', active: r.active !== false }));
  LEDGER = [...sys, ...custom];
}
const acctOf = (code) => LEDGER.find((a) => a.code === code);
function acctName(code) { const a = acctOf(code); return a?.name || (SYS_ACCTS[code] || code === 'transfer' ? t('cat_' + code) : code); }
/** Type of a custom account (null for built-in ones, whose accounting rules are fixed). */
const customType = (code) => { const a = acctOf(code); return a && !a.system ? a.type : null; };
const isRevenue = (x) => x.type === 'income' && (REVENUE_CODES.includes(x.category) || customType(x.category) === 'income');
const isOtherExpense = (x) => x.type === 'expense' && (x.category === 'other' || customType(x.category) === 'expense');
/** Options for a picker: built-in codes given + active custom accounts of the given types + anything already selected. */
function acctOpts(sysCodes, types, keep = []) {
  const ok = (a) => keep.includes(a.code) || (a.active && (a.system ? sysCodes.includes(a.code) : types.includes(a.type)));
  return LEDGER.filter(ok).sort((a, b) => (a.system === b.system ? 0 : a.system ? -1 : 1) || (a.system ? sysCodes.indexOf(a.code) - sysCodes.indexOf(b.code) : acctName(a.code).localeCompare(acctName(b.code)))).map((a) => [a.code, acctName(a.code)]);
}

/* ---------------- Document numbering (Settings → Numbering) ----------------
   Format per series: prefix + separator + zero-padded number, e.g. RCT-0001. The prefix may contain
   {YYYY} {YY} {MM}; the counter then restarts for each new prefix. The next number is always
   max(start, highest number already used with this prefix + 1), so numbers synced in from other
   devices are taken into account and a number is never reused on this device. */
const DOC_SERIES = { bills: { def: 'BIL', stores: ['bills'] }, expenses: { def: 'EXP', stores: ['expenses'] }, payments: { def: 'PAY', stores: ['transactions'] }, receipts: { def: 'RCT', stores: ['transactions'] }, transfers: { def: 'TRF', stores: ['transactions'] } };
function docSeriesOf(store, r) { return store === 'bills' ? 'bills' : store === 'expenses' ? 'expenses' : store === 'transactions' ? (r.type === 'expense' ? 'payments' : r.type === 'transfer' ? 'transfers' : 'receipts') : null; }
async function docFormat(series) { return { prefix: DOC_SERIES[series].def, sep: '-', digits: 4, start: 1, on: true, ...(await meta.get('docfmt:' + series, {})) }; }
function docPrefix(f, iso) { const d = ymd(iso || nowISO()); return f.prefix.replace(/\{YYYY\}/g, d.slice(0, 4)).replace(/\{YY\}/g, d.slice(2, 4)).replace(/\{MM\}/g, d.slice(5, 7)) + (f.prefix ? f.sep : ''); }
const docFormatNo = (f, n, iso) => docPrefix(f, iso) + String(n).padStart(Math.max(1, Math.min(10, +f.digits || 1)), '0');
const docIssued = new Set(); // numbers handed out but maybe not written yet
async function docHighest(series, pre) {
  let max = 0;
  for (const no of docIssued) if (no.startsWith(pre) && /^\d+$/.test(no.slice(pre.length))) max = Math.max(max, parseInt(no.slice(pre.length), 10));
  for (const st of DOC_SERIES[series].stores) for (const r of await list(st, { withDeleted: true })) {
    if (typeof r.doc_no !== 'string' || !r.doc_no.startsWith(pre)) continue;
    const tail = r.doc_no.slice(pre.length); if (/^\d+$/.test(tail)) max = Math.max(max, parseInt(tail, 10));
  }
  return max;
}
async function docNextNo(series, f) { f = f || (await docFormat(series)); const pre = docPrefix(f); return docFormatNo(f, Math.max(+f.start || 1, (await docHighest(series, pre)) + 1)); }
let docLock = Promise.resolve();
/** Called by save(): gives new Bills/Expenses/Payments/Receipts their number (and a new one if a transaction flips between money in and out). */
function docAssign(store, r) {
  const series = docSeriesOf(store, r); if (!series || r.deleted_at) return Promise.resolve();
  const run = docLock.then(async () => {
    const prev = r.id ? await getRec(store, r.id) : null;
    const flipped = prev && store === 'transactions' && prev.doc_no && prev.type !== r.type;
    if (r.doc_no && !flipped) return;
    const f = await docFormat(series); if (!f.on) { if (flipped) r.doc_no = null; return; }
    r.doc_no = await docNextNo(series, f); docIssued.add(r.doc_no);
  });
  docLock = run.catch(() => {}); return run;
}
const docTag = (x) => (x.doc_no ? `<b style="color:var(--text)">${esc(x.doc_no)}</b> · ` : '');

/* ---------------- Transactions ---------------- */
const TX_CATS = ['rent', 'fees', 'deposit_in', 'deposit_refund', 'commission_in', 'landlord_rent', 'other'];
const txSelected = () => (S.params.cats || '').split(',').filter(Boolean);
const txCatsOf = (x) => (x.type === 'transfer' ? [...new Set((x.lines || []).map((l) => l.account))] : (Array.isArray(x.categories) && x.categories.length ? x.categories : [x.category])).filter(Boolean);
const txCatLabel = (x) => (x.type === 'transfer' ? `${(x.lines || []).filter((l) => l.side === 'from').map((l) => acctName(l.account)).join(' + ')} → ${(x.lines || []).filter((l) => l.side === 'to').map((l) => acctName(l.account)).join(' + ')}` : txCatsOf(x).map((c) => acctName(c)).join(' + '));
/** Category shares of a transaction: its saved split when valid, otherwise the whole amount under its main category. */
function txParts(x) {
  const sp = Array.isArray(x.splits) ? x.splits.filter((p) => p && p.category && Number.isFinite(p.amount_fils)) : [];
  if (sp.length > 1 && sp.reduce((a, p) => a + p.amount_fils, 0) === x.amount_fils) return sp;
  return [{ category: x.category || txCatsOf(x)[0] || 'other', amount_fils: x.amount_fils }];
}
/** One row per category share — used by accounting and the dashboard so a split is never counted twice. */

let tessWorker = null;
async function getTesseract(onProgress) {
  if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/tesseract.min.js'; s.onload = res; s.onerror = () => rej(new Error(t('ocr_load_failed'))); document.head.appendChild(s); });
  if (!tessWorker) {
    const base = new URL('vendor/', location.href).href;
    tessWorker = await Tesseract.createWorker('eng', 1, { workerPath: base + 'worker.min.js', corePath: base + 'core', langPath: base + 'lang', gzip: true, workerBlobURL: false, logger: (m) => onProgress && onProgress(m) });
  }
  return tessWorker;
}
async function preprocess(file) { // grayscale + contrast + scale for better OCR
  const bmp = await createImageBitmap(file); const scale = Math.min(2, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = bmp.width * scale; c.height = bmp.height * scale; const g = c.getContext('2d');
  g.drawImage(bmp, 0, 0, c.width, c.height); const img = g.getImageData(0, 0, c.width, c.height); const p = img.data;
  for (let i = 0; i < p.length; i += 4) { let v = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; v = Math.max(0, Math.min(255, (v - 128) * 1.4 + 128)); p[i] = p[i + 1] = p[i + 2] = v; }
  g.putImageData(img, 0, 0); return c;
}
/** Heuristics to pull amount / date / merchant from receipt text. */
function parseReceipt(text) {
  const lines = text.split('\n').map((s) => s.trim()).filter(Boolean);
  const num = (s) => parseFloat(s.replace(/,/g, ''));
  const amtRe = /(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})\b/g;
  let amount = null;
  const keyRe = /(grand\s*total|total\s*(amount|due|incl|aed)?|net\s*(amount|total)|amount\s*(due|payable)|balance\s*due|المجموع|الإجمالي)/i;
  for (const l of lines.filter((l) => keyRe.test(l) && !/sub\s*-?total|vat\s*\d|tax\s*amount/i.test(l))) {
    const m = [...l.matchAll(amtRe)].map((x) => num(`${x[1]}.${x[2]}`)); if (m.length) amount = Math.max(amount || 0, ...m);
  }
  if (amount === null) { const all = [...text.matchAll(amtRe)].map((x) => num(`${x[1]}.${x[2]}`)).filter((v) => v < 1e7); if (all.length) amount = Math.max(...all); }
  let date = null; const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  let m = text.match(/\b(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})\b/);
  if (m) { let [, d, mo, y] = m.map(Number); if (y < 100) y += 2000; if (mo > 12 && d <= 12) [d, mo] = [mo, d]; if (mo <= 12 && d <= 31) date = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
  if (!date && (m = text.match(/\b(\d{4})[/.-](\d{1,2})[/.-](\d{1,2})\b/))) date = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if (!date && (m = text.match(/\b(\d{1,2})[\s-]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s,-]*(\d{2,4})\b/i))) { let y = +m[3]; if (y < 100) y += 2000; date = `${y}-${String(MON[m[2].toLowerCase()]).padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  if (date && (date > todayYMD() || date < '2000-01-01')) date = null;
  const merchant = lines.find((l) => /[A-Za-z]{3,}/.test(l) && !/(tax\s*invoice|invoice|receipt|trn|vat|tel|phone|date|www\.|@|p\.?o\.?\s*box|cashier)/i.test(l) && l.length <= 48) || '';
  return { amount_fils: amount !== null ? Math.round(amount * 100) : null, date, merchant: merchant.replace(/[^\p{L}\p{N}&.,'\- ]/gu, '').trim() };
}
async function runOcrFlow(file) {
  let closeProg; const prog = modal(`${sheetHead(t('reading_receipt'))}<p class="muted small" id="ocrs">${esc(t('ocr_loading'))}</p><div class="progress"><i id="ocrp"></i></div>`, { onMount: (el, close) => { closeProg = close; } });
  let parsed = { amount_fils: null, date: null, merchant: '' }; let text = '';
  try {
    const w = await getTesseract((m) => { const p = $('#ocrp'); if (p && m.progress) p.style.width = Math.round(m.progress * 100) + '%'; const s = $('#ocrs'); if (s && m.status) s.textContent = m.status; });
    const r = await w.recognize(await preprocess(file)); text = r.data.text || ''; parsed = parseReceipt(text);
  } catch (e) { console.error(e); toast(t('ocr_failed'), 'err'); }
  closeProg && closeProg(); await prog;
  const blob = await downscaleImage(file, 1400, 0.75);
  await formSheet({ title: t('confirm_receipt'), fields: await expenseFields(), rec: { merchant: parsed.merchant, amount_fils: parsed.amount_fils, date: ymdToISO(parsed.date || todayYMD()), category: 'maintenance' },
    extraHTML: `<img src="${objURL(blob)}" alt="" style="max-width:100%;max-height:220px;border-radius:12px"><p class="tiny muted">${esc(t('ocr_local_only'))}</p>${text ? `<details><summary class="small muted">${esc(t('ocr_text'))}</summary><pre class="tiny" style="white-space:pre-wrap">${esc(text)}</pre></details>` : ''}`,
    onSave: async (x) => { const r = await save('expenses', { ...x, source: 'ocr' }); await idb.put('attachments', { id: uuid(), entity: 'expenses', record_id: r.id, kind: 'receipt', name: file.name, type: blob.type, size: blob.size, blob, created_at: nowISO() }); invalidate('attachments'); toast(t('saved'), 'ok'); go('#/expenses'); refresh(); } });
}

/* ---------------- Property accounting (§3.4) ---------------- */
async function accountingData(from, to, pid) {
  const inR = (iso) => { const d = ymd(iso); return d >= from && d <= to; };
  const props = (await list('properties')).filter((p) => !pid || p.id === pid);
  const tx = txFlat(await list('transactions')); const ex = await list('expenses'); const bills = await list('bills'); const sch = await list('payment_schedules'); const leases = await list('leases');
  const row = (p) => {
    const m = (x) => (p ? x.property_id === p.id : true);
    const rent = sum(tx.filter((x) => m(x) && isRevenue(x) && inR(x.date)), (x) => x.amount_fils);
    const outstanding = sum(sch.filter((s) => m(s) && s.status === 'due' && ymd(s.due_date) <= to), (s) => s.amount_fils);
    const ls = leases.filter((l) => m(l));
    const held = sum(ls.filter((l) => ['Held', 'Partially refunded'].includes(l.deposit_status)), (l) => l.deposit_fils - (l.deposit_refunded_fils || 0));
    const refunded = sum(tx.filter((x) => m(x) && x.category === 'deposit_refund' && inR(x.date)), (x) => x.amount_fils);
    const maint = sum(ex.filter((x) => (p ? x.property_id === p.id : !!x.property_id) && inR(x.date)), (x) => x.amount_fils) + sum(bills.filter((b) => (p ? b.property_id === p.id : !!b.property_id) && b.status === 'paid' && inR(b.paid_on)), (b) => b.amount_fils);
    const landlord = sum(tx.filter((x) => m(x) && x.category === 'landlord_rent' && inR(x.date)), (x) => x.amount_fils);
    const otherExp = sum(tx.filter((x) => m(x) && isOtherExpense(x) && inR(x.date)), (x) => x.amount_fils);
    return { name: p ? p.name : t('overall'), rent, outstanding, held, refunded, maint, landlord, net: rent - maint - landlord - otherExp };
  };
  return { rows: props.map(row), total: pid ? null : row(null) };
}

/* ---------------- Charts (SVG, no library) ---------------- */
function lineChart(series, { h = 200, unit = '' } = {}) {
  const pts = series.flatMap((s) => s.points); if (pts.length < 1) return `<div class="empty small">${esc(t('chart_need_data'))}</div>`;
  const W = 640, H = h, P = { l: 44, r: 12, t: 12, b: 26 };
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000; x1 += 86400000; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.15 || 5; y0 -= pad; y1 += pad;
  const X = (v) => P.l + ((v - x0) / (x1 - x0)) * (W - P.l - P.r); const Y = (v) => H - P.b - ((v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = [0, 0.5, 1].map((f) => y0 + f * (y1 - y0));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((s) => s.name).join(', '))}">
    ${ticks.map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${Math.round(v)}</text>`).join('')}

/* Timed local reminders: medicines, meals, appointments, bills (while the app is open or in background) */
const fired = new Set();
async function reminderTick() {
  if (!S.account) return;
  const now = nowHM(); const today = todayYMD(); const wd = weekdayKey();
  if (hasModule('health')) {
    for (const m of await list('medicines')) {
      if (m.active === false || (m.start_date && ymd(m.start_date) > today) || (m.end_date && ymd(m.end_date) < today)) continue;
      for (const tm of m.times || []) { const k = `med:${m.id}:${today}:${tm}`; if (tm === now && !fired.has(k)) { fired.add(k); localNotify(t('med_reminder'), `${m.name} ${m.dose || ''}`, k); } }
    }
    for (const f of await list('food_timetable')) { if (f.day !== 'daily' && f.day !== wd) continue; const k = `food:${f.id}:${today}`; if (f.time === now && !fired.has(k)) { fired.add(k); localNotify(t('meal_' + f.meal), f.items || '', k); } }
    for (const a of await list('appointments')) { const at = Date.parse(a.date_time) - (Number(a.remind_minutes) || 60) * 60000; const k = `appt:${a.id}`; if (Date.now() >= at && Date.now() < at + 120000 && !fired.has(k)) { fired.add(k); localNotify(t('appt_reminder'), `${a.doctor} · ${fmtDateTime(a.date_time)}`, k); } }
  }
  if (now === '09:00') for (const b of (await list('bills')).filter((b) => b.status !== 'paid' && daysUntil(b.due_date) === 1)) { const k = `bill:${b.id}:${today}`; if (!fired.has(k)) { fired.add(k); localNotify(t('bill_reminder'), `${b.name} · ${fmtAED(b.amount_fils)}`, k); } }
}

async function blobToB64(b) { return { __blob: b64.enc(await b.arrayBuffer()), type: b.type }; }
Object.assign(ACTIONS, {
  export: async () => {
    const withAtt = $('#incatt')?.checked; const stores = {};
    for (const s of [...DATA_STORES, 'trash']) stores[s] = await idb.getAll(s);
    if (withAtt) {
      stores.attachments = await Promise.all((await idb.getAll('attachments')).map(async (a) => ({ ...a, blob: await blobToB64(a.blob) })));
      stores.vault_files = await Promise.all((await idb.getAll('vault_files')).map(async (v) => ({ ...v, data: await blobToB64(v.data) }))); // still AES-GCM encrypted
    }
    const out = { app: 'digitz-pms', schema_version: APP.schema, exported_at: nowISO(), user_id: S.user?.id, include_attachments: !!withAtt, stores, ...(withAtt ? { vault_keys: S.account.vault } : {}) };
    download(`digitz-backup-${todayYMD()}.json`, JSON.stringify(out), 'application/json');
    toast(t('backup_done'), 'ok');
  },
  import: async () => {
    const [file] = await pickFiles({ accept: 'application/json,.json' }); if (!file) return;
    let data; try { data = JSON.parse(await file.text()); } catch { toast(t('bad_backup'), 'err'); return; }
    if (data.app !== 'digitz-pms' || typeof data.schema_version !== 'number' || !data.stores) { toast(t('bad_backup'), 'err'); return; }
    if (data.schema_version > APP.schema) { toast(t('backup_newer'), 'err'); return; }
    const allowed = new Set([...DATA_STORES, 'trash', 'attachments', 'vault_files']);
    const names = Object.keys(data.stores).filter((s) => allowed.has(s) && Array.isArray(data.stores[s]));
    const mode = await modal(`${sheetHead(t('import_preview'))}<p class="small muted">${esc(t('exported_on', { d: fmtDateTime(data.exported_at) }))}</p>
      <div class="tblwrap"><table class="tbl"><tbody>${names.map((s) => `<tr><td>${esc(t('ent_' + s))}</td><td class="num">${data.stores[s].length}</td></tr>`).join('')}</tbody></table></div>
      <div class="list" style="margin-top:12px"><button class="item" data-m="merge"><div class="grow"><div class="t">${esc(t('merge'))}</div><div class="s">${esc(t('merge_note'))}</div></div></button>
      <button class="item" data-m="replace"><div class="grow"><div class="t">${esc(t('replace_all'))}</div><div class="s">${esc(t('replace_note'))}</div></div></button></div>`,
    { onMount: (el, close) => el.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => close(b.dataset.m))) });
    if (!mode) return;
    if (mode === 'replace' && !(await confirmTwice(t('replace_all')))) return;
    // Decode blobs + re-key vault files BEFORE opening the transaction (a transaction cannot wait on non-IDB work)
    const prepared = {};
    for (const s of names) prepared[s] = data.stores[s].filter((r) => r && typeof r.id === 'string');
    if (prepared.attachments) prepared.attachments = prepared.attachments.map((a) => ({ ...a, blob: a.blob?.__blob ? new Blob([b64.dec(a.blob.__blob)], { type: a.blob.type }) : null })).filter((a) => a.blob);
    if (prepared.vault_files?.length) {
      const sameKeys = JSON.stringify(data.vault_keys) === JSON.stringify(S.account.vault);
      if (!sameKeys) {
        if (!data.vault_keys) { delete prepared.vault_files; toast(t('vault_skip_nokeys'), 'err'); }
        else {
          if (!(await unlockVault())) { delete prepared.vault_files; }
          else {
            const pin = await modal(`${sheetHead(t('backup_pin'))}<p class="small muted">${esc(t('backup_pin_note'))}</p><form><div class="field"><input class="inp" type="password" inputmode="numeric" maxlength="6" id="bp"></div><div class="actions"><button type="button" class="btn ghost" data-close>${esc(t('skip'))}</button><button class="btn primary">${esc(t('ok'))}</button></div></form>`,
              { onMount: (el, close) => { el.querySelector('form').onsubmit = (e) => { e.preventDefault(); close(el.querySelector('#bp').value); }; } });
            let oldKey = null; try { if (pin) oldKey = await vaultKeyFromPin(pin, data.vault_keys); } catch {}
            if (!oldKey) { delete prepared.vault_files; toast(t('vault_skip_pin'), 'err'); }
            else prepared.vault_files = await Promise.all(prepared.vault_files.filter((v) => v.data?.__blob).map(async (v) => {
              const plain = await decryptBlob(oldKey, { iv: v.iv, data: new Blob([b64.dec(v.data.__blob)]), mime: v.mime }); const e2 = await encryptBlob(S.dek, plain); return { ...v, iv: e2.iv, data: e2.data };
            }));
          }
        }
      } else prepared.vault_files = prepared.vault_files.filter((v) => v.data?.__blob).map((v) => ({ ...v, data: new Blob([b64.dec(v.data.__blob)]) }));
    }
    const stores = Object.keys(prepared);
    try {
      const tx = await idb.tx([...stores, 'sync_queue'], 'readwrite');
      const done = new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted')); });
      for (const s of stores) {
        const os = tx.objectStore(s);
        if (mode === 'replace') os.clear();
        for (const r of prepared[s]) {
          if (mode === 'merge') {
            const cur = await idb.req(os.get(r.id));
            if (cur && cur.updated_at && r.updated_at && Date.parse(cur.updated_at) >= Date.parse(r.updated_at)) continue; // newest wins
          }
          os.put(r);
          if (SYNC_FIELDS[s]) tx.objectStore('sync_queue').put({ id: `${s}:${r.id}`, entity: s, record_id: r.id, queued_at: nowISO() });
        }
      }
      await done;
    } catch (e) { console.error(e); toast(t('import_failed'), 'err'); return; } // whole import rolled back
    cache.clear(); await recomputeStatuses(false);
    toast(t('import_done'), 'ok'); scheduleSync(); refresh();
  },
});

/* =====================================================================

   ===================================================================== */
async function boot() {
  document.documentElement.lang = LANG;
  document.documentElement.dataset.theme = flags.get('theme', 'dark');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e));
  try { await navigator.storage?.persist?.(); } catch {}
  await idb.open();
  S.account = await meta.get('account');
  if (S.account) {
    S.user = S.account.user; S.session = await meta.get('session');
    const srv = await meta.get('server'); if (srv) { S.modules = srv.modules || []; S.agency = srv.agency; S.sync = srv.sync; }
  }
  await purgeTrash(); // permanently removes trash older than 30 days on app start
  render();
}
boot().catch((e) => { console.error(e); document.getElementById('root').innerHTML = '<p style="padding:24px">Digitz PMS could not start: ' + esc(e.message) + '</p>'; });
